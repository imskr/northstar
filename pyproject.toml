[project]
name = "northstar-portfolio"
version = "2.0.0"
description = "A private, self-hosted ETF portfolio ledger for long-term European investors."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shubham Kumar" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
